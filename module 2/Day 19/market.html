<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Addis Market shopping list for keeping track of items and prices."
    />
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="market.css" />
  </head>
  <body>
    <main class="page">
      <section class="shopping-card">
        <header class="heading">
          <p class="label">ADDIS MARKET</p>
          <h1>My Shopping List</h1>
          <p class="intro">
            Add what you need, keep track of what you bought, and see your
            total.
          </p>
        </header>

        <form id="add-form" class="add-form">
          <div class="field">
            <label for="name">Item name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="e.g. Bread"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="price">Price in ETB</label>
            <input
              type="number"
              id="price"
              name="price"
              placeholder="e.g. 85"
              min="0.01"
              step="0.01"
            />
          </div>

          <button type="submit">Add Item</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>

        <section class="list-section">
          <div class="list-heading">
            <h2>Things to buy</h2>
            <span id="item-count">0 items</span>
          </div>

          <ul id="list"></ul>

          <p id="empty-state" class="empty-state">
            Your shopping list is empty.
          </p>
        </section>

        <footer class="summary">
          <span>Total</span>
          <strong><span id="total">0.00</span> ETB</strong>
        </footer>
      </section>
    </main>

    <script src="market.js"></script>
  </body>
</html>
